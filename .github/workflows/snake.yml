name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"   # cada 12 horas
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: Cristian2040
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300E676&color_dots=%232a2444,%235b21b6,%237c3aed,%23a855f7,%23b026ff
            dist/github-contribution-grid-snake.svg?color_snake=%2300E676&color_dots=%23f3eeff,%23e9d5ff,%23c084fc,%23a855f7,%23b026ff

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
